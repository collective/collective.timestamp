# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Plone package

on:
  push:
  pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                  - python-version: "3.11"
                    plone-version: "60"
                  - python-version: "3.12"
                    plone-version: "61"

        steps:
            - uses: actions/setup-python@v4
              with:
                  python-version: '3.12'
            - uses: actions/checkout@v3
            - uses: actions/cache@v3
              with:
                  path: |
                    ~/.cache/pip
                    ~/buildout-cache
                    ~/extends
                  key: ${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.plone-version }}-${{ hashFiles('**/setup.py') }}-${{ hashFiles('**/requirements.txt') }}-${{ hashFiles('**/*.cfg') }}-${{ hashFiles('**/constraints.txt') }}
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ matrix.python-version }}
            - name: setup buildout cache
              run: |
                  mkdir -p ~/buildout-cache/{eggs,downloads}
                  mkdir ~/.buildout
                  echo "[buildout]" > $HOME/.buildout/default.cfg
                  echo "download-cache = $HOME/buildout-cache/downloads" >> $HOME/.buildout/default.cfg
                  echo "eggs-directory = $HOME/buildout-cache/eggs" >> $HOME/.buildout/default.cfg
            - name: Install dependencies and run buildout
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_plone${{ matrix.plone-version }}.txt
                  buildout -Nt 5 -c test_plone${{ matrix.plone-version }}.cfg
            - name: Black-Check
              run: |
                  pip install black
                  black --check .
            - name: Test
              run: |
                  bin/test
              env:
                PLONE-VERSION: ${{ matrix.plone-version }}
                PYTHON-VERSION: ${{ matrix.python-version }}
            - name: Coverage
              run: |
                  pip install coveralls
                  coverage run bin/test
                  coveralls --service=github
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              if: matrix.python-version == '3.12'
